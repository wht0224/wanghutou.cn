////////////////////////////////////////////////////////////////////////////
// 工具函数与通用绘制
////////////////////////////////////////////////////////////////////////////
const Utils = {
    wrapText(text, maxW, charW = 9) {
        const chars = text.split('');
        const lines = [];
        let cur = '';
        for (let i = 0; i < chars.length; i++) {
            if ((cur + chars[i]).length * charW > maxW) {
                lines.push(cur);
                cur = chars[i];
            } else {
                cur += chars[i];
            }
        }
        if (cur) lines.push(cur);
        return lines;
    },
    clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
    },
    lerp(a, b, t) {
        return a + (b - a) * t;
    },
    hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null;
    }
};

const Draw = {
    ctx: null,
    init(ctx) { this.ctx = ctx; },
    rect(x, y, w, h, color) {
        if (!this.ctx) return;
        this.ctx.fillStyle = color;
        this.ctx.fillRect(x, y, w, h);
    },
    rectStroke(x, y, w, h, color, lineWidth = 1) {
        if (!this.ctx) return;
        this.ctx.strokeStyle = color;
        this.ctx.lineWidth = lineWidth;
        this.ctx.strokeRect(x, y, w, h);
    },
    text(text, x, y, color, font, textAlign = 'left') {
        if (!this.ctx) return;
        this.ctx.fillStyle = color;
        this.ctx.font = font;
        this.ctx.textAlign = textAlign;
        this.ctx.fillText(text, x, y);
    },
    gradientRect(x, y, w, h, colorTop, colorBottom) {
        if (!this.ctx) return;
        const gradient = this.ctx.createLinearGradient(x, y, x, y + h);
        gradient.addColorStop(0, colorTop);
        gradient.addColorStop(1, colorBottom);
        this.ctx.fillStyle = gradient;
        this.ctx.fillRect(x, y, w, h);
    },
    gradientRadial(cx, cy, r, colorCenter, colorEdge) {
        if (!this.ctx) return;
        const gradient = this.ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        gradient.addColorStop(0, colorCenter);
        gradient.addColorStop(1, colorEdge);
        this.ctx.fillStyle = gradient;
        this.ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
    }
};

////////////////////////////////////////////////////////////////////////////
// 日志系统
////////////////////////////////////////////////////////////////////////////
const Logger = {
    log(msg, level = 'info') {
        if (CONFIG.DEBUG) {
            console[level](`[VG] ${msg}`);
        }
    },
    warn(msg) { this.log(msg, 'warn'); },
    error(msg) { this.log(msg, 'error'); }
};

////////////////////////////////////////////////////////////////////////////
// 音效系统 - Web Audio API (无需外部文件)
////////////////////////////////////////////////////////////////////////////
const Sound = {
    ctx: null,
    enabled: true,
    init() {
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
            this.enabled = false;
            Logger.warn('音频初始化失败');
        }
    },
    play(type) {
        if (!this.enabled || !this.ctx) return;
        try {
            const o = this.ctx.createOscillator();
            const g = this.ctx.createGain();
            o.connect(g);
            g.connect(this.ctx.destination);
            const now = this.ctx.currentTime;
            
            switch (type) {
                case 'click':
                    o.frequency.setValueAtTime(800, now);
                    o.frequency.exponentialRampToValueAtTime(400, now + 0.1);
                    g.gain.setValueAtTime(0.3, now);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                    o.start(now); o.stop(now + 0.1);
                    break;
                case 'pickup':
                    o.frequency.setValueAtTime(600, now);
                    o.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
                    g.gain.setValueAtTime(0.25, now);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                    o.start(now); o.stop(now + 0.15);
                    break;
                case 'paint':
                    o.type = 'sawtooth';
                    o.frequency.setValueAtTime(200, now);
                    o.frequency.exponentialRampToValueAtTime(100, now + 0.2);
                    g.gain.setValueAtTime(0.15, now);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    o.start(now); o.stop(now + 0.2);
                    break;
                case 'dialogue':
                    o.frequency.setValueAtTime(440, now);
                    g.gain.setValueAtTime(0.1, now);
                    g.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    o.start(now); o.stop(now + 0.08);
                    break;
            }
        } catch (e) {
            Logger.warn('音效播放失败');
        }
    },
    resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }
};

// 游戏状态管理

const G = {

    inventory: [],

    currentNode: null,

    selectedChoice: 0,
    showText: '',

    fatherTimer: 0,
    paintingPhase: 0,
    paintingAnimTimer: 0,
    animatingPainting: false,
    candleTimer: 0,
    flashTime: 0,
    flashAlpha: 0,
    
    setFlag(key, val) {
        this.flags[key] = val;
        Logger.log(`Flag set: ${key} = ${val}`);
    },
    hasFlag(key) {
        return !!this.flags[key];
    },
    addItem(item) {
        if (!this.inventory.includes(item)) {
            this.inventory.push(item);
            Logger.log(`Item added: ${item}`);
        }
    },
    hasItem(item) {
        return this.inventory.includes(item);
    },
    modEmotion(v) {
        const old = this.emotion;
        this.emotion = Utils.clamp(this.emotion + v, 0, 100);
        Logger.log(`Emotion: ${old} → ${this.emotion}`);
    },
    startDialogue(treeId) {
        this.dialogueActive = true;
        this.currentDialogue = treeId;
        this.selectedChoice = 0;
        this.advanceDialogue('node1');
        Sound.play('dialogue');
    },
    advanceDialogue(nodeId) {
        const tree = DIALOGUES[this.currentDialogue];
        if (!tree) { this.endDialogue(); return; }
        const node = tree.find(n => n.id === nodeId);
        if (!node) { this.endDialogue(); return; }
        this.currentNode = node;
        this.dialogueSpeaker = node.speaker;
        this.dialogueText = node.text;
        this.dialogueChoices = node.choices || [];
        if (this.dialogueChoices.length === 0 && node.next) {
            if (this.autoNextTimer) clearTimeout(this.autoNextTimer);
            this.autoNextTimer = setTimeout(() => {
                if (node.next === 'end') this.endDialogue();
                else this.advanceDialogue(node.next);
            }, 2000);
        }
    },
    selectChoice(idx) {
        if (this.autoNextTimer) clearTimeout(this.autoNextTimer);
        const choice = this.dialogueChoices[idx];
        if (!choice) return;
        const all = [];
        if (choice.effect) all.push(...[].concat(choice.effect));
        if (choice.extraEffect) all.push(...[].concat(choice.extraEffect));
        for (const e of all) {
            if (e.type === 'emotion') this.modEmotion(e.value);
            else if (e.type === 'flag') this.setFlag(e.key, e.value);
            else if (e.type === 'item') this.addItem(e.itemName);
        }
        Sound.play('click');
        if (choice.nextNode === 'end') this.endDialogue();
        else this.advanceDialogue(choice.nextNode);
    },
    endDialogue() {
        if (this.autoNextTimer) clearTimeout(this.autoNextTimer);
        this.dialogueActive = false;
        this.currentDialogue = null;
        this.currentNode = null;
        this.dialogueText = '';
        this.dialogueChoices = [];
        this.dialogueSpeaker = '';
    },
    showFloatingText(text, dur = 200) {
        this.showText = text;
        this.showTextTimer = dur;
    }
};

function triggerCandleFlash() {

function updateFlash() {
    if (G.flashTime > 0) {
        G.flashTime--;
        G.flashAlpha *= 0.88;
        Draw.rect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT, `rgba(255, 200, 100, ${G.flashAlpha})`);
    }
}

////////////////////////////////////////////////////////////////////////////
// 输入处理
////////////////////////////////////////////////////////////////////////////
let mouseX = CONFIG.CANVAS_WIDTH / 2, mouseY = CONFIG.CANVAS_HEIGHT / 2;

function getClickPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) * (CONFIG.CANVAS_WIDTH / rect.width),
        y: (e.clientY - rect.top) * (CONFIG.CANVAS_HEIGHT / rect.height)
    };
}

function isInside(pos, rect) {
    return pos.x >= rect.x && pos.x <= rect.x + rect.w && pos.y >= rect.y && pos.y <= rect.y + rect.h;
}

function isHoverCh(ch) {
    if (!ch.visible) return false;
    const p = ch.position;
    return mouseX >= p.x && mouseX <= p.x + p.w + 4 && mouseY >= p.y && mouseY <= p.y + p.h + 4;
}

function handleClick(pos) {
    Sound.resume();
    Sound.play('click');
    
    if (G.dialogueActive) {
        handleDialogueClick(pos);
        return;
    }
    
    if (G.characters.father.visible && isInside(pos, { ...G.characters.father.position, w: 48, h: 64 })) {
        G.startDialogue('dialogue_father_confront');
        return;
    }
    if (isInside(pos, { ...G.characters.mother.position, w: 48, h: 64 })) {
        G.emotion < 40 ? G.startDialogue('dialogue_mother_comfort') : G.startDialogue('dialogue_mother_art');
        return;
    }
    
    if (isInside(pos, INTERACTABLES.candle.position)) {
        G.counters.candlesLit++;
        triggerCandleFlash();
        if (G.counters.candlesLit >= 3) {
            G.setFlag('candleClicked3', true);
            G.showFloatingText('烛光摇曳，你注意到柜子下有什么东西……', 240);
        }
        return;
    }
    
    const st = INTERACTABLES.scarlet_tube;
    if (!G.hasItem('猩红') && (st.hidden ? G.hasFlag(st.visibleCondition) : true) && isInside(pos, st.position)) {
        G.addItem('猩红');
        G.showFloatingText(st.pickupText);
        Sound.play('pickup');
        return;
    }
    
    if (!G.hasItem('钴蓝') && isInside(pos, INTERACTABLES.cobalt_tube.position)) {
        G.addItem('钴蓝');
        G.showFloatingText(INTERACTABLES.cobalt_tube.pickupText);
        Sound.play('pickup');
        return;
    }
    
    if (isInside(pos, INTERACTABLES.trash_basket.position)) {
        G.counters.trashSearch++;
        if (G.counters.trashSearch >= 3 && !G.hasFlag('chromeFound')) {
            G.setFlag('chromeFound', true);
            G.showFloatingText('你找到了铬黄颜料管！', 200);
            Sound.play('pickup');
        } else if (G.counters.trashSearch < 3) {
            G.showFloatingText('你在废纸篓中翻找……', 120);
        } else {
            G.showFloatingText('废纸篓里已经没有东西了。', 120);
        }
        return;
    }
    
    const cht = INTERACTABLES.chrome_tube;
    if (!G.hasItem('铬黄') && (cht.hidden ? G.hasFlag(cht.visibleCondition) : true) && isInside(pos, cht.position)) {
        G.addItem('铬黄');
        G.showFloatingText(cht.pickupText);
        Sound.play('pickup');
        return;
    }
    
    if (isInside(pos, INTERACTABLES.letter.position)) {
        if (!G.hasFlag('letterRead')) {
            G.setFlag('letterRead', true);
            G.showFloatingText('"亲爱的提奥……我渴望用深色调描绘那些在灯光下吃土豆的人……"', 340);
            G.fatherTimer = 300;
        } else {
            G.showFloatingText('"亲爱的提奥……我渴望用深色调描绘那些在灯光下吃土豆的人……"');
        }
        return;
    }
    
    if (isInside(pos, INTERACTABLES.easel.position)) {
        const rq = INTERACTABLES.easel.requiredItems;
        if (rq.every(i => G.hasItem(i)) && !G.hasFlag('paintingDone')) {
            startPainting();
        } else if (G.hasFlag('paintingDone')) {
            G.showFloatingText('《吃土豆的人》——完成。');
        } else {
            G.showFloatingText('还需要更多颜料才能开始创作。');
        }
        return;
    }
    
    if (isInside(pos, INTERACTABLES.bible.position)) {
        G.showFloatingText('"父亲希望我成为牧师，但我的讲坛在田野与矿坑。"');
        return;
    }
}

function handleDialogueClick(pos) {
    if (G.dialogueChoices.length === 0) return;
    const py = CONFIG.CANVAS_HEIGHT - 145;
    for (let i = 0; i < G.dialogueChoices.length; i++) {
        const bx = 20, by = py + 20 + i * 45;
        if (pos.x >= bx && pos.x <= bx + CONFIG.CANVAS_WIDTH - 40 && pos.y >= by && pos.y <= by + 38) {
            G.selectChoice(i);
            return;
        }
    }
}

////////////////////////////////////////////////////////////////////////////
// 键盘支持
////////////////////////////////////////////////////////////////////////////
function handleKeyDown(e) {
    if (!G.dialogueActive) return;
    
    if (G.dialogueChoices.length > 0) {
        if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
            e.preventDefault();
            G.selectedChoice = (G.selectedChoice + 1) % G.dialogueChoices.length;
            Sound.play('click');
        } else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
            e.preventDefault();
            G.selectedChoice = (G.selectedChoice - 1 + G.dialogueChoices.length) % G.dialogueChoices.length;
            Sound.play('click');
        } else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            G.selectChoice(G.selectedChoice);
        }
    }
}

////////////////////////////////////////////////////////////////////////////
// 绘画逻辑
////////////////////////////////////////////////////////////////////////////
function startPainting() {
    G.paintingPhase = 0;
    G.paintingAnimTimer = 0;
    G.animatingPainting = true;
    Sound.play('paint');
}

function updatePaintingAnim() {
    if (!G.animatingPainting) return;
    G.paintingAnimTimer++;
    if (G.paintingAnimTimer > 35) {
        G.paintingAnimTimer = 0;
        G.paintingPhase++;
        if (G.paintingPhase > 0 && G.paintingPhase <= 5) Sound.play('paint');
        if (G.paintingPhase >= 5) {
            G.animatingPainting = false;
            G.setFlag('paintingDone', true);
            G.modEmotion(20);
            G.showFloatingText('你调和出泥土与阴影的颜色，画作完成了。', 260);
            Sound.play('pickup');
        }
    }
}

////////////////////////////////////////////////////////////////////////////

////////////////////////////////////////////////////////////////////////////
let canvas, ctx;
let lastTime = 0, accumulator = 0;

function gameLoop(timestamp) {
    if (lastTime === 0) lastTime = timestamp;
    const deltaTime = timestamp - lastTime;
    lastTime = timestamp;
    
    accumulator += deltaTime;
    while (accumulator >= CONFIG.FRAME_INTERVAL) {
        update(CONFIG.FRAME_INTERVAL);
        accumulator -= CONFIG.FRAME_INTERVAL;
    }
    
    render();
    requestAnimationFrame(gameLoop);
}

function update(dt) {
    if (G.hasFlag('letterRead') && !G.characters.father.visible && G.fatherTimer > 0) {
        G.fatherTimer--;
        if (G.fatherTimer <= 0) {
            G.characters.father.visible = true;
            G.showFloatingText('父亲推门而入……');
        }
    }
    
    if (G.animatingPainting) updatePaintingAnim();
}

function render() {
    ctx.clearRect(0, 0, CONFIG.CANVAS_WIDTH, CONFIG.CANVAS_HEIGHT);
    
    drawScene();
    drawCandleLight();
    updateFlash();
    
    drawCandle();
    const st = INTERACTABLES.scarlet_tube;
    if (!G.hasItem('猩红') && (st.hidden ? G.hasFlag(st.visibleCondition) : true)) drawPaintTube(st.position.x, st.position.y, '#b22222', '#d44444');
    if (!G.hasItem('钴蓝')) { const ct = INTERACTABLES.cobalt_tube; drawPaintTube(ct.position.x, ct.position.y, '#2244aa', '#4466cc'); }
    drawTrashBasket();
    const cht = INTERACTABLES.chrome_tube;
    if (!G.hasItem('铬黄') && (cht.hidden ? G.hasFlag(cht.visibleCondition) : true)) drawPaintTube(cht.position.x, cht.position.y, '#c8a000', '#e8c020');
    drawLetter();
    drawBible();
    drawEasel();
    
    drawCharacter(G.characters.vincent, isHoverCh(G.characters.vincent));
    drawCharacter(G.characters.mother, isHoverCh(G.characters.mother));
    if (G.characters.father.visible) drawCharacter(G.characters.father, isHoverCh(G.characters.father));
    
    drawUI();
}

function requestFullscreen() {
    const elem = document.documentElement;
    if (elem.requestFullscreen) {
        elem.requestFullscreen();
    } else if (elem.webkitRequestFullscreen) {
        elem.webkitRequestFullscreen();
    } else if (elem.msRequestFullscreen) {
        elem.msRequestFullscreen();
    }
}

function init() {
    try {
        canvas = document.getElementById('gc');
        ctx = canvas.getContext('2d');
        canvas.width = CONFIG.CANVAS_WIDTH;
        canvas.height = CONFIG.CANVAS_HEIGHT;
        ctx.imageSmoothingEnabled = false;
        
        Draw.init(ctx);
        Sound.init();
        
        canvas.addEventListener('mousedown', e => { 
            e.preventDefault(); 
            if (!document.fullscreenElement) requestFullscreen();
            handleClick(getClickPos(e)); 
        });
        canvas.addEventListener('touchstart', e => { 
            e.preventDefault(); 
            if (!document.fullscreenElement) requestFullscreen();
            handleClick(getClickPos(e.touches[0])); 
        }, { passive: false });
        canvas.addEventListener('mousemove', e => { const p = getClickPos(e); mouseX = p.x; mouseY = p.y; });
        canvas.addEventListener('touchmove', e => { e.preventDefault(); const p = getClickPos(e.touches[0]); mouseX = p.x; mouseY = p.y; }, { passive: false });
        document.addEventListener('keydown', handleKeyDown);
        
        Logger.log('游戏初始化完成');
        requestAnimationFrame(gameLoop);
    } catch (e) {
        Logger.error(`初始化失败: ${e.message}`);
        alert('游戏初始化失败，请刷新页面重试');
    }
}

init();
})();
</script>
</body>
</html>
