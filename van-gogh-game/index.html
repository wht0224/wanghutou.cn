<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>梵高 - 第一章：吃土豆的人</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-wrapper {
            position: relative;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 3px solid #3a2820;
            box-shadow: 0 0 40px rgba(180,120,40,0.2), 0 0 80px rgba(180,100,30,0.1);
        }
        @media (max-width: 660px) {
            canvas {
                width: 100vw;
                height: auto;
                border: none;
            }
        }
        #controls-hint {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: #c8a840;
            padding: 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            border: 1px solid #5a4030;
            border-radius: 3px;
            line-height: 1.8;
            z-index: 1000;
        }
        #controls-hint span {
            color: #ffe0a0;
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gc"></canvas>
    </div>
    <div id="controls-hint">
        <div><span>↑↓</span> 选择对话选项</div>
        <div><span>Enter</span> 确认选择</div>
        <div><span>Esc</span> 关闭对话框</div>
        <div><span>M</span> 切换音效</div>
    </div>

    <script src="js/logger.js"></script>
    <script src="js/gameState.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/soundManager.js"></script>
    <script src="js/animationSystem.js"></script>
    <script src="js/inputManager.js"></script>
    <script src="js/data.js"></script>
    <script src="js/uiManager.js"></script>
    <script src="js/sceneRenderer.js"></script>
    <script src="js/characterRenderer.js"></script>
    <script src="js/itemRenderer.js"></script>
    <script src="js/interactionManager.js"></script>
    <script src="js/game.js"></script>

    <script>
        'use strict';
        window.addEventListener('DOMContentLoaded', () => {
            Logger.info('Starting Van Gogh Game - Chapter 1');
            const game = new Game();
            game.init();
        });
    </script>
</body>
</html>
